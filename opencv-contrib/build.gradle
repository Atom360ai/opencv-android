plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
}

android {
    namespace "com.quickbirdstudios.opencv"
    compileSdk 35

    defaultConfig {
        minSdk 21
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Store .so files uncompressed with 16KB alignment so consumers get
    // properly aligned native libs in their APK when they set
    // android:extractNativeLibs="false" (which our manifest merge enforces).
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    // Expose the release variant for Maven publishing.
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // 'api' makes OpenCV visible to any app that depends on this library —
    // no need to re-declare it in the consuming app's build.gradle.
    //
    // org.opencv:opencv 4.11.0+ includes the fix for 16 KB page-size support
    // (upstream issue #26724, landed Jan 2025). Every LOAD segment in the
    // .so files is aligned to a 16 KB boundary — the requirement for Android 15+.
    api 'org.opencv:opencv:4.13.0'
}

// Publish as com.quickbirdstudios:opencv-contrib:4.10.0
// Run: ./gradlew :opencv-contrib:publishToMavenLocal
//
// The maven-publish plugin provides publishToMavenLocal automatically —
// no explicit repository declaration needed for Maven Local.
publishing {
    publications {
        release(MavenPublication) {
            groupId    = 'com.quickbirdstudios'
            artifactId = 'opencv-contrib'
            version    = '4.13.0'

            afterEvaluate {
                from components.release
            }

            pom {
                name        = 'OpenCV Android (contrib)'
                description = 'OpenCV 4.13.0 for Android — 16 KB page-size compatible. ' +
                              'Wraps org.opencv:opencv:4.13.0 (issue #26724 fix, Jan 2025).'
                url         = 'https://github.com/QuickBirdEng/opencv-android'
                licenses {
                    license {
                        name = 'BSD 3-Clause License'
                        url  = 'https://opensource.org/licenses/BSD-3-Clause'
                    }
                }
            }
        }
    }
}
