plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace "com.quickbirdstudios.opencvexample"
    compileSdk 35

    defaultConfig {
        applicationId "com.quickbirdstudios.opencvexample"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    // Required for 16KB page size support on Android 15+ (API 35).
    // Stores .so files uncompressed in the APK so the OS can directly mmap them
    // with the correct page-size alignment.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // Use the local opencv-contrib library module (mirrors what a real consumer
    // gets after running ./gradlew :opencv-contrib:publishToMavenLocal and
    // adding implementation "com.quickbirdstudios:opencv-contrib:4.13.0").
    implementation project(':opencv-contrib')
}
